<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TeddyClip</title>
<style>
  /* Mid-century modern: warm paper, burnt orange, mustard, teal, avocado, walnut. */
  :root {
    --paper: #f3ead8; --card: #fbf6ec; --card-2: #f6eedf; --line: #d8c7a8; --walnut: #5b3d29;
    --ink: #2e231b; --muted: #7d6a58; --orange: #d4612a; --orange-dark: #b44e1d;
    --mustard: #d9a227; --teal: #2b7a74; --avocado: #6f7d2c; --plum: #7b4a6e; --cream: #fff9ee;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink);
         font: 15px/1.5 "Century Gothic", Futura, "Jost", "Trebuchet MS", sans-serif; }
  header { position: sticky; top: 0; z-index: 2; background: var(--paper); }
  header .bar { display: flex; align-items: center; gap: 12px; max-width: 1280px; margin: 0 auto; padding: 16px 24px; }
  header .stripes { height: 8px; background: linear-gradient(90deg, var(--orange) 0 40%, var(--mustard) 40% 70%, var(--teal) 70% 88%, var(--avocado) 88%); }
  .brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
  .brand h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: 1px; color: var(--walnut); text-transform: lowercase; }
  .brand small { color: var(--muted); letter-spacing: 2px; text-transform: uppercase; font-size: 11px; margin-top: 4px; }
  main { max-width: 1280px; margin: 0 auto; padding: 22px 24px 60px; }
  button { font: inherit; border: 2px solid var(--walnut); background: var(--cream); color: var(--walnut);
           padding: 7px 18px; border-radius: 999px; cursor: pointer; font-weight: 600; letter-spacing: .3px;
           transition: transform .08s ease, box-shadow .08s ease; }
  button:hover:not(:disabled) { transform: translate(-1px, -1px); box-shadow: 2px 2px 0 var(--walnut); }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: var(--orange); border-color: var(--orange-dark); color: var(--cream); }
  button.primary:hover:not(:disabled) { box-shadow: 2px 2px 0 var(--orange-dark); }
  button.danger { border-color: var(--line); color: var(--orange-dark); background: transparent; }
  button.small { padding: 3px 12px; font-size: 13px; border-width: 1.5px; }
  .panel { background: var(--card); border: 1.5px solid var(--line); border-radius: 18px; padding: 18px 20px;
           margin-bottom: 20px; box-shadow: 5px 5px 0 rgba(91, 61, 41, .12); }
  .muted { color: var(--muted); }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .inbox-list { margin: 8px 0 0; padding-left: 20px; }
  .inbox-list li::marker { color: var(--orange); }
  .job h2 { margin: 0 0 10px; font-size: 16px; display: flex; align-items: center; gap: 10px; color: var(--walnut); }
  .spinner { width: 16px; height: 16px; border-radius: 50%; animation: spin 1.1s linear infinite;
             background: conic-gradient(var(--orange) 0 25%, var(--mustard) 0 50%, var(--teal) 0 75%, var(--avocado) 0); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .prow { display: flex; align-items: baseline; gap: 12px; margin-bottom: 8px; font-size: 15px; }
  .prow .spacer { flex: 1; }
  .prow b { color: var(--orange-dark); font-size: 18px; min-width: 3.2em; text-align: right; }
  .track { height: 16px; border-radius: 999px; background: var(--card-2); border: 1.5px solid var(--line); overflow: hidden; }
  .fill { height: 100%; width: 0; border-radius: 999px; transition: width .6s ease;
          background: repeating-linear-gradient(-45deg, var(--orange) 0 14px, #df7a3f 14px 28px); background-size: 40px 40px; }
  .fill.moving { animation: stripes 1.2s linear infinite; }
  .fill.failed { background: var(--plum); }
  @keyframes stripes { to { background-position: 40px 0; } }
  details { margin-top: 12px; }
  summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  .log { max-height: 220px; overflow: auto; margin: 8px 0 0; padding: 12px 14px; background: var(--walnut);
         border-radius: 12px; font: 12.5px/1.55 Consolas, monospace; color: #f6e7cf; white-space: pre-wrap; }
  .session h2 { margin: 0; font-size: 19px; color: var(--walnut); }
  .session .head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .session .head .spacer { flex: 1; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .clip { background: var(--card-2); border: 1.5px solid var(--line); border-radius: 16px; overflow: hidden;
          display: flex; flex-direction: column; }
  .clip video, .highlight video { width: 100%; aspect-ratio: 16 / 9; background: #1f1712; display: block; }
  .highlight video { border-radius: 14px; }
  .clip .info { padding: 10px 14px 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .clip .title { font-weight: 700; }
  .clip .why { font-size: 13px; color: var(--muted); }
  .clip .foot { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: auto; }
  .clip .foot .spacer { flex: 1; }
  .badge { font-size: 11.5px; font-weight: 700; padding: 2px 10px; border-radius: 999px; color: var(--cream);
           letter-spacing: .4px; text-transform: uppercase; }
  .k-trigger, .k-marker { background: var(--orange); } .k-laughter { background: var(--mustard); color: var(--ink); }
  .k-joke { background: var(--teal); } .k-game { background: var(--plum); } .k-loud { background: var(--avocado); }
  .highlight { margin-bottom: 16px; max-width: 720px; }
  .empty { text-align: center; padding: 44px 20px; }
  dialog#ask { border: 1.5px solid var(--line); border-radius: 20px; background: var(--card); color: var(--ink);
               padding: 26px 28px 22px; width: min(420px, 90vw); box-shadow: 8px 8px 0 rgba(91, 61, 41, .18);
               font: inherit; text-align: center; }
  dialog#ask::backdrop { background: rgba(46, 35, 27, .45); }
  dialog#ask h3 { margin: 10px 0 6px; font-size: 19px; color: var(--walnut); overflow-wrap: anywhere; }
  dialog#ask p { margin: 0 0 20px; font-size: 14px; }
  .ask-art { width: 46px; height: 46px; margin: 0 auto; border-radius: 50%;
             background: radial-gradient(circle, var(--cream) 0 34%, transparent 35%), var(--orange);
             box-shadow: 0 0 0 5px var(--mustard); }
  .ask-buttons { display: flex; gap: 12px; justify-content: center; }
  .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--walnut);
           color: var(--cream); padding: 10px 18px; border-radius: 999px; display: none; box-shadow: 4px 4px 0 var(--orange); }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">
      <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="18" fill="#d4612a"/>
        <g stroke="#d9a227" stroke-width="2.4" stroke-linecap="round">
          <line x1="20" y1="4" x2="20" y2="11"/><line x1="20" y1="29" x2="20" y2="36"/>
          <line x1="4" y1="20" x2="11" y2="20"/><line x1="29" y1="20" x2="36" y2="20"/>
          <line x1="8.7" y1="8.7" x2="13.6" y2="13.6"/><line x1="26.4" y1="26.4" x2="31.3" y2="31.3"/>
          <line x1="31.3" y1="8.7" x2="26.4" y2="13.6"/><line x1="13.6" y1="26.4" x2="8.7" y2="31.3"/>
        </g>
        <circle cx="20" cy="20" r="7.5" fill="#fff9ee"/>
        <path d="M18 16.5 L24 20 L18 23.5 Z" fill="#2b7a74"/>
      </svg>
      <div><h1>teddyclip</h1><small>couch co-op highlights</small></div>
    </div>
    <button id="add">Add recordings</button>
    <button id="make" class="primary">Make clips</button>
  </div>
  <div class="stripes"></div>
</header>
<main>
  <section class="panel" id="inbox"></section>
  <section class="panel job" id="job" hidden>
    <h2><span class="spinner" id="spin"></span><span id="job-name"></span></h2>
    <div class="prow"><span id="pstep"></span><span class="spacer"></span><span class="muted" id="ptime"></span><b id="ppct"></b></div>
    <div class="track"><div class="fill" id="pfill"></div></div>
    <details id="details"><summary>Show details</summary><pre class="log" id="log"></pre></details>
  </section>
  <div id="sessions"></div>
</main>
<div class="toast" id="toast"></div>
<dialog id="ask">
  <div class="ask-art" aria-hidden="true"></div>
  <h3 id="ask-title"></h3>
  <p id="ask-text" class="muted"></p>
  <div class="ask-buttons">
    <button id="ask-no">Cancel</button>
    <button id="ask-yes" class="primary">Delete</button>
  </div>
</dialog>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const KIND = {trigger: "Clip that", marker: "OBS marker", laughter: "Laughter", joke: "Joke", game: "Game event", loud: "Loud"};
let busy = false, lastSessions = "", wasRunning = false;

function toast(text) {
  const t = $("toast"); t.textContent = text; t.style.display = "block";
  clearTimeout(toast.timer); toast.timer = setTimeout(() => (t.style.display = "none"), 4000);
}

async function post(url, body) {
  const r = await fetch(url, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body || {})});
  const data = await r.json().catch(() => ({}));
  if (!r.ok) toast(data.error || "Something went wrong");
  return r.ok;
}

function renderInbox(inbox) {
  const ready = inbox.filter((f) => f.ready).length;
  let html;
  if (!inbox.length) {
    html = `<div class="row"><b>Inbox is empty.</b><span class="muted">Click <i>Add recordings</i>, drop your OBS recordings in that folder (inside a folder named after the game if you like), then click <i>Make clips</i>.</span></div>`;
  } else {
    html = `<b>${inbox.length} recording${inbox.length === 1 ? "" : "s"} in the inbox</b>` +
      `<ul class="inbox-list">${inbox.map((f) => `<li>${esc(f.name)}${f.ready ? "" : ' <span class="muted">(still being recorded or copied)</span>'}</li>`).join("")}</ul>`;
  }
  $("inbox").innerHTML = html;
  $("make").disabled = busy || ready === 0;
  $("make").title = ready ? "" : "Add a finished recording to the inbox first";
}

function minutes(seconds) {
  if (seconds < 60) return "under a minute";
  const m = Math.round(seconds / 60);
  return m < 60 ? `${m} min` : `${Math.floor(m / 60)} h ${m % 60} min`;
}

function timeText(job, f) {
  if (!job.running) return job.elapsed ? `took ${minutes(job.elapsed)}` : "";
  // Too early to guess: the first stages are quick, so the estimate would swing wildly.
  if (f < 0.03 || job.elapsed < 20) return `${minutes(job.elapsed)} so far`;
  return `about ${minutes(job.elapsed * (1 - f) / f)} left`;
}

function renderJob(job) {
  const show = job.running || job.lines.length > 0;
  $("job").hidden = !show;
  if (!show) return;
  $("spin").style.display = job.running ? "" : "none";
  $("job-name").textContent = job.running ? job.name + "..." : job.name + (job.failed ? ": finished with problems (open Show details)" : ": done");
  const f = Math.min(1, Math.max(0, job.fraction || 0));
  $("pfill").style.width = (f * 100).toFixed(1) + "%";
  $("pfill").className = "fill" + (job.running ? " moving" : "") + (job.failed ? " failed" : "");
  $("ppct").textContent = Math.floor(f * 100) + "%";
  $("pstep").textContent = job.running ? (job.step || "Working") : (job.failed ? "Stopped" : "Finished");
  $("ptime").textContent = timeText(job, f);
  if (job.failed) $("details").open = true;
  const log = $("log"), atBottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 20;
  log.textContent = job.lines.join("\n");
  if (atBottom) log.scrollTop = log.scrollHeight;
}

function clipCard(session, c) {
  const kind = (c.kind ? `<span class="badge k-${esc(c.kind)}">${esc(KIND[c.kind] || c.kind)}</span>` : "") +
    (c.events || []).map((e) => `<span class="badge k-game">${esc(e)}</span>`).join("");
  return `<div class="clip">
      <video src="${c.url}" controls preload="metadata"></video>
      <div class="info">
        <div class="title">${esc(c.title)}</div>
        ${c.why && c.why !== c.kind ? `<div class="why">${esc(c.why)}</div>` : ""}
        <div class="foot">${kind}<span class="muted">${esc(c.start)}</span><span class="spacer"></span>
          <button class="small danger" data-delete="${esc(c.file)}" data-title="${esc(c.title)}" data-session="${esc(session)}">Delete</button></div>
      </div></div>`;
}

function renderSessions(sessions) {
  const key = JSON.stringify(sessions);
  if (key === lastSessions) return;  // re-drawing would restart any video that is playing
  lastSessions = key;
  if (!sessions.length) {
    $("sessions").innerHTML = `<div class="panel empty muted">No clips yet. Your clips will show up here after <b>Make clips</b>.</div>`;
    return;
  }
  $("sessions").innerHTML = sessions.map((s) => `
    <section class="panel session">
      <div class="head">
        <h2>${esc(s.name)}</h2>
        <span class="muted">${s.clips.length} clip${s.clips.length === 1 ? "" : "s"}</span>
        ${s.incomplete ? '<span class="badge k-trigger">did not finish</span>' : ""}
        <span class="spacer"></span>
        <button class="small" data-open="clips" data-session="${esc(s.name)}">Open folder</button>
        <button class="small" data-highlight="${esc(s.name)}" ${s.clips.length ? "" : "disabled"}>${s.highlight ? "Remake highlight" : "Make highlight"}</button>
      </div>
      ${s.highlight ? `<div class="highlight"><div class="muted" style="margin-bottom:6px">Highlight video
          <button class="small" data-open="highlights">Open folder</button></div>
          <video src="${s.highlight}" controls preload="metadata"></video></div>` : ""}
      ${s.clips.length ? `<div class="grid">${s.clips.map((c) => clipCard(s.name, c)).join("")}</div>`
                       : '<div class="muted">No clips left in this folder.</div>'}
    </section>`).join("");
}

async function refresh() {
  try {
    const r = await fetch("/api/state", {cache: "no-store"});
    const st = await r.json();
    busy = st.job.running;
    if (wasRunning && !busy) lastSessions = "";  // a job just finished: show its results
    wasRunning = busy;
    renderInbox(st.inbox);
    renderJob(st.job);
    renderSessions(st.sessions);
    document.querySelectorAll("[data-highlight]").forEach((b) => (b.disabled = busy || b.dataset.empty === "1"));
  } catch (e) {
    toast("TeddyClip is not running. Open it again from the desktop shortcut.");
  }
}

// A yes/no question in TeddyClip's own style (the browser's confirm box looks out of place).
// Enter or Delete says yes; Esc, Cancel or a click outside says no.
function ask(title, text) {
  const d = $("ask");
  $("ask-title").textContent = title;
  $("ask-text").textContent = text;
  return new Promise((resolve) => {
    const done = (yes) => { d.onclose = null; d.close(); resolve(yes); };
    $("ask-yes").onclick = () => done(true);
    $("ask-no").onclick = () => done(false);
    d.onclick = (e) => { if (e.target === d) done(false); };
    d.onclose = () => resolve(false);
    d.showModal();
    $("ask-yes").focus();
  });
}

$("add").onclick = () => post("/api/open", {folder: "inbox"});
$("make").onclick = async () => { if (await post("/api/process")) refresh(); };
document.addEventListener("click", async (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.delete) {
    if (!await ask(`Delete "${b.dataset.title || b.dataset.delete}"?`,
                   "It goes to the Recycle Bin, so you can get it back if you change your mind.")) return;
    if (await post("/api/delete", {session: b.dataset.session, file: b.dataset.delete})) { lastSessions = ""; refresh(); }
  } else if (b.dataset.highlight) {
    if (await post("/api/highlight", {session: b.dataset.highlight})) refresh();
  } else if (b.dataset.open) {
    post("/api/open", {folder: b.dataset.open, session: b.dataset.session});
  }
});

refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
