[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "teddyclip"
version = "0.1.0"
description = "Turn long OBS gameplay recordings into clips and highlights"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "AGPL-3.0-or-later"
dependencies = [
    "faster-whisper",
    "ctranslate2>=4.8,<4.9",
    "av<19",
    "numpy",
    "pyyaml",
    "requests",
    "torch",
    "rapidocr-onnxruntime",
]

[project.optional-dependencies]
dev = ["pytest"]
gpu = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12==9.10.*"]

[project.scripts]
teddyclip = "teddyclip.cli:main"

[tool.setuptools]
packages = ["teddyclip"]

[tool.setuptools.package-data]
teddyclip = ["ui.html"]

[tool.pytest.ini_options]
addopts = "-m 'not slow'"
markers = ["slow: needs GPU, network, Ollama or model weights"]
testpaths = ["tests"]
